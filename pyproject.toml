[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrepo-guard"
version = "0.3.2"
description = "A Safety Contract for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentRepo Guard maintainers" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
agentrepo = "agentrepo_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
